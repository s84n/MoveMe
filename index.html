<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9f5ee">
  <script>try { var t = localStorage.getItem('moveme-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}</script>
  <title>MoveMe</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="view" aria-live="polite"></main>
  <nav id="tabs" aria-label="Hauptnavigation">
    <button data-tab="day"><span class="ti">📅</span>Tag</button>
    <button data-tab="week"><span class="ti">🗓️</span>Woche</button>
    <button data-tab="stats"><span class="ti">📈</span>Statistik</button>
    <button data-tab="settings"><span class="ti">⚙️</span>Mehr</button>
  </nav>
  <script type="module" src="app.js"></script>
</body>
</html>
